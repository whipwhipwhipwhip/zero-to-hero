[project]
name = "zero_to_hero"
version = "0.0.1"
description = "Working through Karpathy's Neural Networks: Zero to Hero"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2",
    "torch>=2.5",
    "matplotlib>=3.10",
    "scikit-learn>=1.6",
    # micrograd graph drawing - also needs the system `dot` binary (brew install graphviz)
    "graphviz>=0.20",
    "optuna>=4.0",
    "nanotok",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.4",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
nanotok = { git = "https://github.com/whipwhipwhipwhip/nanotok", tag = "v0.0.4" }

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"
