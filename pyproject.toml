[project]
name = "zero_to_hero"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "jupyterlab>=4.4.10",
    "matplotlib>=3.10.7",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "scikit-learn",
    "graphviz",
    "torch",
    "torchtyping",
    "hypothesis",
    "pytest",
]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"
